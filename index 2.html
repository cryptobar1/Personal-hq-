<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1017"><title>Personal HQ</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef2f8;background:#0b0f16}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:flex;min-height:100vh}.sidebar{width:235px;background:#10151e;border-right:1px solid #26303c;padding:28px 14px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;letter-spacing:-.7px;padding:0 12px 30px}.brand span{color:#9b9bff}.nav{display:grid;gap:6px}.nav button{border:0;text-align:left;color:#aab6c5;background:transparent;border-radius:12px;padding:12px 14px}.nav button.active,.nav button:hover{background:#242b3b;color:white}.sidebar small{display:block;color:#768396;margin:30px 12px;line-height:1.6}.main{max-width:1240px;width:100%;padding:36px 42px 80px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.eyebrow{color:#9da9bb;font-size:12px;text-transform:uppercase;letter-spacing:2px}.title{font-size:32px;font-weight:760;letter-spacing:-1px;margin:5px 0 8px}.muted{color:#9aa7b9}.pill{border:1px solid #354154;border-radius:100px;padding:8px 12px;color:#c9d1dd;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:#151c27;border:1px solid #293344;border-radius:18px;padding:20px;min-width:0}.card h3{font-size:15px;margin:0 0 14px}.stat{font-size:27px;font-weight:750;margin:12px 0 3px}.tiny{font-size:12px;color:#9caabc}.section{margin-top:22px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row+ .row{margin-top:10px}.btn{border:1px solid #3d4a5d;background:#263246;color:white;border-radius:10px;padding:9px 12px}.btn.primary{background:#7778f8;border-color:#7778f8;color:#080b17;font-weight:700}.btn.danger{background:#40242b;border-color:#6d3944}.field{width:100%;background:#0e141e;color:#f1f4fa;border:1px solid #3a4659;border-radius:10px;padding:11px;margin:5px 0 10px}textarea.field{min-height:80px;resize:vertical}.list{display:grid;gap:9px}.item{background:#101722;border:1px solid #283346;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}.item.done .grow{text-decoration:line-through;color:#78869a}.item button{background:transparent;border:0;color:#9baac1}.tag{background:#263348;border-radius:30px;padding:4px 8px;font-size:11px;color:#c4d1e5}.empty{color:#8795a9;font-size:13px;padding:15px 0}.hidden{display:none!important}.section-title{font-size:19px;margin:26px 0 14px}.progress{height:8px;background:#293344;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#8a8aff}.notice{background:#242a22;border:1px solid #505c3c;color:#e0e8d2;border-radius:12px;padding:12px;font-size:12px;line-height:1.5}.footer{font-size:12px;color:#79869b;margin-top:32px}.tabbar{display:none}.quote{font-size:18px;line-height:1.5}.flexwrap{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:100px;background:#222c3b;border:1px solid #354258;color:#d9e2f2;font-size:12px}.details{margin-top:10px}.details summary{cursor:pointer;color:#aab6c8}.spaced{line-height:1.7}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:900px){.sidebar{display:none}.main{padding:24px 16px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.cols{grid-template-columns:1fr}.title{font-size:27px}.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;overflow:auto;background:#101620;border-top:1px solid #303a49;padding:8px;gap:3px;z-index:10}.tabbar button{min-width:75px;flex:1;background:none;border:0;color:#9ba8b9;font-size:11px;padding:9px 4px;border-radius:10px}.tabbar button.active{background:#2a3449;color:#fff}.card{padding:16px}}@media(max-width:390px){.grid{gap:9px}.stat{font-size:22px}.card{padding:12px}}
.hero{background:linear-gradient(115deg,#25274c,#161e2b 70%);border:1px solid #46446c;border-radius:20px;padding:28px;margin-bottom:20px}.hero h2{font-size:29px;letter-spacing:-1px;margin:8px 0}.hero p{color:#b5bfd2;line-height:1.65;max-width:700px}.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.kicker{font-size:11px;color:#b6b2ff;letter-spacing:2px;font-weight:750}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:12px 5px;text-align:center;background:#111925;border:1px solid #2c3849;border-radius:9px;font-size:11px;color:#aeb9ca}.day strong{display:block;color:#fff;margin-top:6px;font-size:17px}.day.today{border-color:#9995ff;background:#292a4b}.quicklinks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quicklinks a{background:#202b3c;padding:13px;border-radius:12px;text-align:center;border:1px solid #364258;font-size:12px}.barplot{display:flex;gap:8px;align-items:end;height:95px}.barplot>div{flex:1;background:linear-gradient(#a6a0ff,#6666b9);border-radius:5px 5px 0 0;min-height:4px}@media(max-width:600px){.hero{padding:20px}.hero h2{font-size:23px}.quicklinks{grid-template-columns:repeat(2,1fr)}.day{padding:10px 2px;font-size:10px}.day strong{font-size:14px}}

.greeting{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 16px}.greeting h2{font-size:29px;letter-spacing:-1px;margin:7px 0}.greeting p{font-size:13px;margin:0}.brief{background:linear-gradient(120deg,#252648,#171d30);border:1px solid #494775;border-radius:17px;padding:17px 20px;margin-bottom:16px}.brief p{color:#c5cce0;font-size:13px;line-height:1.7;margin-bottom:0}.metric .stat{font-size:27px}.metric .stat small{font-size:13px;color:#8996a9}.smallstat{font-size:19px!important}.textbtn{border:0;background:none;color:#b2adff;font-size:12px;padding:6px}.day{cursor:pointer;width:100%;min-width:0}.eventdot{color:#a49aff;display:block;font-size:10px;margin-top:4px}.day-detail{padding:14px 0 0}.schedule-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #293344;font-size:13px}.schedule-item>span{color:#9da9bd;min-width:77px;font-size:11px;line-height:1.5}.schedule-item strong{font-size:13px}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actiongrid button{text-align:center}.revenue-bars{display:flex;align-items:end;gap:10px;height:190px;justify-content:space-around}.revenue-month{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px}.revenue-bar{width:min(100%,45px);background:linear-gradient(#a5a0ff,#686acb);border-radius:5px 5px 0 0}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plan-grid>div{background:#101722;padding:15px;border:1px solid #303a4b;border-radius:12px}.moremenu{display:none}
@media(max-width:900px){.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;padding:7px 5px calc(7px + env(safe-area-inset-bottom));gap:2px}.tabbar button{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px;padding:6px 1px}.tabbar button span{font-size:10px}.moremenu:not(.hidden){display:grid;position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));right:8px;left:8px;z-index:12;background:#1b2432;border:1px solid #45516a;border-radius:15px;padding:9px;box-shadow:0 10px 35px #0008}.moremenu button{padding:14px;text-align:left;background:transparent;border:0;border-bottom:1px solid #354052;color:#e7eaf4}.moremenu button:last-child{border-bottom:0}.main{padding-bottom:calc(95px + env(safe-area-inset-bottom))}.top{margin-bottom:15px}.title{font-size:23px}.top .muted{font-size:12px}.pill{display:none}.greeting h2{font-size:25px}}
@media(max-width:600px){.greeting{align-items:flex-start}.greeting .btn{font-size:12px;padding:9px}.metric .stat{font-size:23px}.plan-grid{grid-template-columns:1fr}.week{gap:4px}.day{padding:9px 2px}.day strong{font-size:15px}.card{padding:15px}.brief{padding:15px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">PERSONAL <span>HQ</span></div><nav class="nav" id="nav"></nav><small>One place for your work, plans, wellbeing and ideas.<br><br>Private data should not be entered into this browser-only prototype.</small></aside><main class="main"><div class="top"><div><div class="eyebrow" id="date"></div><div class="title" id="heading">Your overview</div><div class="muted" id="subtitle">Make today count.</div></div><span class="pill">PERSONAL HQ • V3</span></div><div id="content"></div><div class="footer">Personal HQ • V3 • Local-only records • No live integrations</div></main></div><nav class="tabbar" id="tabbar"></nav><div id="moremenu" class="moremenu hidden"><button onclick="go('social')">◎ Social</button><button onclick="go('travel')">✈ Travel</button><button onclick="go('ai')">✦ AI & Learning / Settings</button></div><script>
const sections=[['home','⌂','Home'],['planner','☷','Planner'],['work','▣','Work'],['health','♡','Health'],['social','◎','Social'],['travel','✈','Travel'],['ai','✦','AI & Learn']];const K='personal-hq-v1';const defaults={tasks:[],events:[],clients:[],income:[],workouts:[],posts:[],trips:[],notes:[],settings:{target:2500,training:3},quoteIndex:0};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(K)||'{}')};for(const k of ['tasks','events','clients','income','workouts','posts','trips','notes'])if(!Array.isArray(db[k]))db[k]=[]}catch{db=structuredClone(defaults)};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch{alert('Browser storage unavailable. Entries may not persist.')}};const money=n=>'£'+Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:0});const id=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const quotes=[['Sikhi','Recognise the whole human race as one.','Teaching associated with Guru Gobind Singh Ji; paraphrased in English.'],['Health','Consistency matters more than the perfect session.','Personal HQ reflection'],['Travel','Stay curious about places and the people who live there.','Personal HQ reflection'],['Lifestyle','Focus on what you can do well today.','Personal HQ reflection'],['Sikhi','Practise honest work, share with others, and remember the Divine.','Summary of Sikh principles; not a direct scripture quotation.'],['Health','Progress is built from repeatable habits.','Personal HQ reflection'],['Travel','The best moments often happen away from the itinerary.','Personal HQ reflection']];function quote(){let day=Math.floor(Date.now()/86400000);return quotes[day%quotes.length]}function form(idName,fields,button='Add'){return `<form onsubmit="addRecord(event,'${idName}')"><div class="cols">${fields.map(f=>`<label>${esc(f[1])}<input class="field" name="${f[0]}" ${f[2]||''} placeholder="${esc(f[3]||'')}" ${f[4]==='optional'?'':'required'}></label>`).join('')}</div><button class="btn primary">${button}</button></form>`}function itemList(key,render){return db[key].length?`<div class="list">${db[key].slice().reverse().map((v,i)=>render(v,db[key].length-1-i)).join('')}</div>`:'<div class="empty">Nothing here yet.</div>'}function del(key,i){if(confirm('Remove this entry?')){db[key].splice(i,1);save();render()}}function addRecord(e,key){e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(key==='income'&&!Number.isFinite(Number(data.amount)))return;db[key].push({...data,id:id(),done:false,created:new Date().toISOString()});save();render()}function toggle(i){db.tasks[i].done=!db.tasks[i].done;save();render()}const taskCard=()=>`<div class="card"><div class="row"><h3>Priority tasks</h3><span class="tag">${db.tasks.filter(t=>!t.done).length} open</span></div><form onsubmit="addRecord(event,'tasks')"><input class="field" name="title" placeholder="Add a task..." required><div class="row"><select class="field" name="priority"><option>Today</option><option>This week</option><option>Later</option></select><button class="btn primary">Add</button></div></form>${itemList('tasks',(t,i)=>`<div class="item ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><div class="grow">${esc(t.title)} <span class="tag">${esc(t.priority)}</span></div><button aria-label="Delete task" onclick="del('tasks',${i})">×</button></div>`)}</div>`;function loadExamples(){if(!confirm('Add fictional example data to explore Personal HQ?'))return;db.events.push({title:'EXAMPLE • Photography shoot',date:new Date().toISOString().slice(0,10),time:'14:00',type:'Work'});db.tasks.push({title:'Follow up on a photography enquiry',priority:'Today',done:false},{title:'Complete upper-body gym session',priority:'Today',done:false},{title:'Plan next Instagram Reel',priority:'This week',done:false});db.income.push({source:'EXAMPLE • Sports shoot',amount:'200',status:'Paid',date:new Date().toISOString().slice(0,10)},{source:'EXAMPLE • Event invoice',amount:'300',status:'Unpaid',date:new Date().toISOString().slice(0,10)});db.posts.push({name:'EXAMPLE • Fashion Reel',views:'12000',likes:'640',follows:'15'});save();render()}
function paidMonth(){let m=new Date().toISOString().slice(0,7);return db.income.filter(x=>String(x.date||'').slice(0,7)===m&&String(x.status||'').trim().toLowerCase()==='paid').reduce((a,x)=>a+(Number(x.amount)||0),0)}
function weekView(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));return Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return `<div class="day ${d.toDateString()===now.toDateString()?'today':''}">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}<strong>${d.getDate()}</strong></div>`}).join('')}
function todayISO(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayEvents(date){return db.events.filter(x=>x.date===date).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')))}
function weekDates(){let n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate());m.setDate(m.getDate()-(m.getDay()+6)%7);return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return {date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,day:d.getDate(),name:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}})}
let selectedDay=todayISO();
function selectDay(d){selectedDay=d;render()}
function calendarBlock(){let events=dayEvents(selectedDay);return `<div class="week">${weekDates().map(d=>`<button class="day ${d.date===selectedDay?'today':''}" onclick="selectDay('${d.date}')"><span>${d.name}</span><strong>${d.day}</strong>${dayEvents(d.date).length?'<span class="eventdot">●</span>':''}</button>`).join('')}</div><div class="day-detail"><strong>${new Date(selectedDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</strong>${events.length?events.map(e=>`<div class="schedule-item"><span>${esc(e.time||'All day')}</span><div><strong>${esc(e.title)}</strong><div class="tiny">${esc(e.type||'Event')}</div></div></div>`).join(''):'<p class="tiny">No events saved for this day.</p>'}</div>`}
function home(){let q=quote(),earned=paidMonth(),open=db.tasks.filter(x=>!x.done),unpaid=db.income.filter(x=>String(x.status||'').trim().toLowerCase()==='unpaid').reduce((a,x)=>a+(Number(x.amount)||0),0),today=dayEvents(todayISO()),weekWorkouts=db.workouts.filter(x=>x.date&&weekDates().some(d=>d.date===x.date)).length,upcoming=db.events.filter(x=>x.date>=todayISO()).sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time))).slice(0,3);return `<div class="greeting"><div><div class="kicker">YOUR PERSONAL COMMAND CENTRE</div><h2>${new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening'}.</h2><p class="muted">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · Focus on what matters today.</p></div><button class="btn primary" onclick="go('planner')">+ Add a task</button></div>
<div class="brief"><div class="row"><strong>✦ Morning briefing</strong><span class="tag">From your saved records</span></div><p>${today.length?`You have ${today.length} event${today.length===1?'':'s'} today.`:'Your calendar is clear today.'} ${open.filter(x=>x.priority==='Today').length?`There are ${open.filter(x=>x.priority==='Today').length} priority tasks to tackle.`:'Set your three priorities for the day.'} Your photography revenue target is ${money(db.settings.target)} per month.</p></div>
<div class="grid"><div class="card metric"><div class="tiny">Photography income · paid this month</div><div class="stat">${money(earned)}</div><div class="tiny">Target ${money(db.settings.target)}</div><div class="progress"><div style="width:${Math.min(100,earned/(db.settings.target||2500)*100)}%"></div></div></div><div class="card metric"><div class="tiny">Open tasks</div><div class="stat">${open.length}</div><div class="tiny">${db.tasks.filter(x=>x.done).length} completed</div></div><div class="card metric"><div class="tiny">Gym logs this week</div><div class="stat">${weekWorkouts} <small>/ ${db.settings.training||3}</small></div><div class="tiny">Sessions logged with a date</div></div><div class="card metric"><div class="tiny">Unpaid invoices</div><div class="stat">${money(unpaid)}</div><div class="tiny">Manual records, not bank verified</div></div></div>
<div class="section cols"><div class="card"><div class="row"><h3>Today's priorities</h3><button class="textbtn" onclick="go('planner')">Planner →</button></div>${open.length?`<div class="list">${open.slice().sort((a,b)=>(a.priority==='Today'?0:1)-(b.priority==='Today'?0:1)).slice(0,3).map(t=>`<div class="item"><input aria-label="Complete task" type="checkbox" onchange="toggle(${db.tasks.indexOf(t)})"><div class="grow">${esc(t.title)} <span class="tag">${esc(t.priority||'Task')}</span></div></div>`).join('')}</div>`:'<p class="empty">No tasks yet. Add your first priority in Planner.</p>'}<button class="btn" onclick="go('planner')">Manage tasks</button></div><div class="card"><div class="row"><h3>Daily inspiration</h3><span class="tag">${esc(q[0])}</span></div><p class="quote">“${esc(q[1])}”</p><p class="tiny">${esc(q[2])}</p></div></div>
<div class="section cols"><div class="card"><div class="row"><h3>Your week</h3><button class="textbtn" onclick="go('planner')">Full planner →</button></div>${calendarBlock()}</div><div class="card"><div class="row"><h3>Coming up</h3><span class="tag">Saved appointments</span></div>${upcoming.length?upcoming.map(e=>`<div class="schedule-item"><span>${esc(e.date)}<br>${esc(e.time||'')}</span><div><strong>${esc(e.title)}</strong><div class="tiny">${esc(e.type||'Event')}</div></div></div>`).join(''):'<p class="empty">No upcoming appointments saved.</p>'}<h3 class="section-title">Quick actions</h3><div class="actiongrid"><button class="btn" onclick="go('work')">＋ Booking</button><button class="btn" onclick="go('health')">＋ Workout</button><button class="btn" onclick="go('social')">＋ Post stats</button><button class="btn" onclick="go('travel')">＋ Trip</button></div></div></div>
<div class="section card"><div class="row"><h3>Connected tools</h3><span class="tag">Shortcuts only</span></div><div class="quicklinks"><a href="https://mail.google.com" target="_blank" rel="noopener">Gmail ↗</a><a href="https://outlook.live.com/mail/" target="_blank" rel="noopener">Outlook ↗</a><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram ↗</a><a href="https://chatgpt.com" target="_blank" rel="noopener">ChatGPT ↗</a></div><p class="tiny">These services are not automatically synced.</p></div>`}
function planner(){let upcoming=db.events.slice().sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time)));return `<div class="card"><div class="row"><h3>Weekly calendar</h3><span class="tag">Tap a day</span></div>${calendarBlock()}<p class="tiny">Your Personal HQ events are stored locally; Apple and Google Calendar are not synced.</p></div><div class="section cols"><div>${taskCard()}</div><div class="card"><h3>Add appointment or event</h3>${form('events',[['title','Event / appointment'],['date','Date','type="date"'],['time','Time','type="time"','','optional'],['type','Type','','Work, personal or fitness','optional']],'Save event')}<h3 class="section-title">Saved events</h3>${upcoming.length?`<div class="list">${upcoming.map(v=>`<div class="item"><div class="grow"><strong>${esc(v.title)}</strong><div class="tiny">${esc(v.date)} · ${esc(v.time||'All day')} · ${esc(v.type||'Event')}</div></div><button aria-label="Delete event" onclick="del('events',${db.events.indexOf(v)})">×</button></div>`).join('')}</div>`:'<div class="empty">No events yet.</div>'}</div></div>`}function work(){let earned=paidMonth(),unpaid=db.income.filter(x=>String(x.status||'').trim().toLowerCase()==='unpaid').reduce((a,x)=>a+(+x.amount||0),0),forecast=db.clients.filter(x=>/booked/i.test(x.status||'')).reduce((a,x)=>a+(+x.fee||0),0),months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return {label:d.toLocaleString('en-GB',{month:'short'}),amount:db.income.filter(x=>String(x.date||'').slice(0,7)===key&&/^paid$/i.test(String(x.status||'').trim())).reduce((a,x)=>a+(+x.amount||0),0)}}),max=Math.max(1,...months.map(x=>x.amount));return `<div class="grid"><div class="card metric"><div class="tiny">Paid this month</div><div class="stat">${money(earned)}</div></div><div class="card metric"><div class="tiny">Monthly target</div><div class="stat">${money(db.settings.target)}</div></div><div class="card metric"><div class="tiny">Outstanding invoices</div><div class="stat">${money(unpaid)}</div></div><div class="card metric"><div class="tiny">Booked job fees (all dates)</div><div class="stat">${money(forecast)}</div></div></div><div class="section cols"><div class="card"><h3>Paid income · last 6 months</h3><div class="revenue-bars">${months.map(m=>`<div class="revenue-month"><div class="tiny">${money(m.amount)}</div><div class="revenue-bar" style="height:${Math.max(5,m.amount/max*130)}px"></div><div class="tiny">${m.label}</div></div>`).join('')}</div><p class="tiny">Based only on manually logged paid entries. This is not bank-verified income.</p></div><div class="card"><h3>Client follow-ups</h3>${db.clients.filter(c=>c.next).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,5).map(c=>`<div class="schedule-item"><span>${esc(c.next)}</span><div><strong>${esc(c.name)}</strong><div class="tiny">${esc(c.status||'Client')} · ${money(c.fee)}</div></div></div>`).join('')||'<p class="empty">No follow-ups scheduled yet.</p>'}<div class="progress"><div style="width:${Math.min(100,earned/(db.settings.target||2500)*100)}%"></div></div><p class="tiny">${money(Math.max(0,db.settings.target-earned))} remaining to your monthly paid-income goal.</p></div></div><div class="section cols"><div class="card"><h3>Clients & bookings</h3>${form('clients',[['name','Client / project'],['fee','Quoted fee (£)','type="number" min="0" step="0.01"'],['status','Status','','Enquiry / Booked / Completed'],['next','Next follow-up','type="date"','','optional']])}<h3 class="section-title">Saved records</h3>${itemList('clients',(v,i)=>`<div class="item"><div class="grow"><strong>${esc(v.name)}</strong><div class="tiny">${esc(v.status)} · ${money(v.fee)} · Follow-up ${esc(v.next||'Not set')}</div></div><button onclick="del('clients',${i})">×</button></div>`)}</div><div class="card"><h3>Income / invoice log</h3>${form('income',[['source','Job or invoice reference'],['amount','Amount (£)','type="number" min="0" step="0.01"'],['status','Payment status','','Paid / Unpaid'],['date','Date','type="date"']])}<h3 class="section-title">Entries</h3>${itemList('income',(v,i)=>`<div class="item"><div class="grow"><strong>${esc(v.source)}</strong><div class="tiny">${money(v.amount)} · ${esc(v.status)} · ${esc(v.date)}</div></div><button onclick="del('income',${i})">×</button></div>`)}</div></div><div class="section notice">Local-only prototype: don't enter sensitive client contact details, invoice contents or financial account information. Payment status is self-reported.</div>`}function social(){return `<div class="cols"><div class="card"><h3>Instagram performance log</h3><p class="muted">Record occasional snapshots from Instagram Insights.</p>${form('posts',[['name','Post / Reel title'],['views','Views','type="number" min="0"'],['likes','Likes','type="number" min="0"'],['follows','New followers attributed (if known)','type="number" min="0"']])}</div><div class="card"><h3>Content snapshots</h3>${itemList('posts',(v,i)=>`<div class="item"><div class="grow"><strong>${esc(v.name)}</strong><div class="tiny">${Number(v.views).toLocaleString()} views · ${Number(v.likes).toLocaleString()} likes · ${Number(v.follows).toLocaleString()} follows (entered)</div></div><button onclick="del('posts',${i})">×</button></div>`)}<p class="tiny">No Instagram API connection. Metrics are manually entered and follower attribution should only be recorded when available.</p><a class="btn" target="_blank" rel="noopener" href="https://www.instagram.com/">Open Instagram ↗</a></div></div>`}function health(){let week=weekDates().map(x=>x.date),sessions=db.workouts.filter(x=>week.includes(x.date)).length,history=db.workouts.slice().reverse();return `<div class="grid"><div class="card metric"><div class="tiny">Gym logs this week</div><div class="stat">${sessions} / ${db.settings.training||3}</div><div class="tiny">Target: 2–3 sessions</div></div><div class="card metric"><div class="tiny">Total exercise logs</div><div class="stat">${db.workouts.length}</div></div><div class="card metric"><div class="tiny">Main goal</div><div class="stat smallstat">Build muscle</div><div class="tiny">And reduce body fat</div></div><div class="card metric"><div class="tiny">Data source</div><div class="stat smallstat">Manual log</div><div class="tiny">Apple Health not connected</div></div></div><div class="section cols"><div class="card"><h3>Log a gym exercise</h3><p class="muted">Log exercises individually with the date, sets, reps and working weight.</p>${form('workouts',[['date','Session date','type="date"'],['name','Exercise / session'],['sets','Sets','type="number" min="0"'],['reps','Reps','type="number" min="0"'],['weight','Weight (kg)','type="number" min="0" step="0.5"']])}</div><div class="card"><h3>Recent training</h3>${history.length?history.slice(0,12).map(v=>`<div class="schedule-item"><span>${esc(v.date||'Undated')}</span><div><strong>${esc(v.name)}</strong><div class="tiny">${esc(v.sets)} × ${esc(v.reps)} · ${esc(v.weight)} kg</div></div></div>`).join(''):'<p class="empty">No exercises logged yet.</p>'}<p class="tiny">Older records may be undated. A log is not necessarily a complete gym session.</p></div></div><div class="section card"><h3>Your flexible weekly plan</h3><div class="plan-grid"><div><strong>Session A</strong><p class="tiny">Full-body strength · 45–60 min</p></div><div><strong>Session B</strong><p class="tiny">Full-body strength · 45–60 min</p></div><div><strong>Optional Session C</strong><p class="tiny">Extra strength, walking or cardio</p></div></div><p class="tiny">These are session placeholders, not a prescribed exercise programme. No automatic recovery or Apple Health analysis is active.</p></div>`}function travel(){return `<div class="cols"><div class="card"><h3>My trips</h3><p class="muted">Add a planned trip and keep key details together.</p>${form('trips',[['place','Destination'],['date','Departure date','type="date"'],['return','Return date','type="date"'],['reference','Flight / booking reference','','Optional']])}</div><div class="card"><h3>Saved trips</h3>${itemList('trips',(v,i)=>`<div class="item"><div class="grow"><strong>${esc(v.place)}</strong><div class="tiny">${esc(v.date)} to ${esc(v.return)} · ${esc(v.reference)}</div></div><button onclick="del('trips',${i})">×</button></div>`)}<p class="tiny">Booking information is not automatically detected. Avoid storing sensitive booking references on a shared device.</p></div></div><div class="section card"><h3>Trip tools</h3><div class="flexwrap"><a class="chip" target="_blank" rel="noopener" href="https://www.google.com/travel/flights">Google Flights ↗</a><a class="chip" target="_blank" rel="noopener" href="https://www.skyscanner.net">Skyscanner ↗</a><a class="chip" target="_blank" rel="noopener" href="https://maps.google.com">Google Maps ↗</a><a class="chip" target="_blank" rel="noopener" href="https://www.metoffice.gov.uk/weather">Weather ↗</a></div><p class="tiny">Flight status, weather and maps are not embedded or synced in V1.</p></div>`}function ai(){return `<div class="cols"><div class="card"><h3>AI assistant</h3><p class="muted spaced">Use ChatGPT for drafting client replies, planning your week, reviewing progress and developing ideas. This site does not send your records to ChatGPT automatically.</p><div class="list">${[['Plan my week','Help me plan a realistic week around photography work, two or three gym sessions, learning and personal admin.'],['Draft an email','Help me write a concise, natural UK English client email. Ask me for the original message and context.'],['Review my business','Help me review my photography bookings, income, profitability and follow-ups. Ask me for the figures first.'],['Plan my content','Help me plan Instagram content for Hargee Visuals based on recent photography work and engagement.']].map(([a,b])=>`<button class="btn" onclick="copyPrompt('${encodeURIComponent(b)}')">${a} · Copy prompt</button>`).join('')}</div><p class="tiny">After copying, paste into ChatGPT. No automatic AI API integration is configured.</p><a class="btn primary" target="_blank" rel="noopener" href="https://chatgpt.com">Open ChatGPT ↗</a></div><div class="card"><h3>Ideas & learning notes</h3>${form('notes',[['title','Topic / idea'],['detail','One-line note','','What did you learn?']])}<h3 class="section-title">Saved ideas</h3>${itemList('notes',(v,i)=>`<div class="item"><div class="grow"><strong>${esc(v.title)}</strong><div class="tiny">${esc(v.detail)}</div></div><button onclick="del('notes',${i})">×</button></div>`)}</div></div><div class="section card"><h3>Backup, privacy & settings</h3><div class="notice">Personal HQ uses browser storage on this device only. There is no login, encrypted sync or live email, bank, health or Instagram connection. Avoid confidential data. Use Export to back up your records before changing browsers or clearing site data.</div><div class="flexwrap"><button class="btn" onclick="exportData()">Export my data (JSON)</button><label class="btn">Import a backup <input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="btn danger" onclick="clearData()">Clear local data</button></div><p class="tiny">Backups contain all information entered into this site. Store them privately. Import replaces the current local records.</p></div>`}function copyPrompt(encoded){let t=decodeURIComponent(encoded);navigator.clipboard?.writeText(t).then(()=>alert('Prompt copied. Paste it into ChatGPT.')).catch(()=>prompt('Copy this prompt:',t))||prompt('Copy this prompt:',t)}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-hq-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let x=JSON.parse(t);for(let k of ['tasks','events','clients','income','workouts','posts','trips','notes'])if(!Array.isArray(x[k]))throw Error('Invalid backup format');if(confirm('Replace all current local records with this backup?')){db={...defaults,...x};save();render()}}).catch(()=>alert('Could not read a valid Personal HQ backup.'))}function clearData(){if(confirm('Permanently clear all Personal HQ entries on this device?')){db=structuredClone(defaults);save();render()}}let page='home';function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}function toggleMore(){$('moremenu').classList.toggle('hidden')}function render(){let p=sections.find(x=>x[0]===page)||sections[0];$('heading').textContent=p[2]==='Home'?'Your overview':p[2];$('subtitle').textContent=({home:'Your day, simplified.',planner:'Focus on what matters.',work:'Hargee Visuals · clients and income.',social:'Track your photography content.',health:'Build consistency, not complexity.',travel:'Everything about your next trip.',ai:'Draft, learn and reflect.'})[page];$('date').textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());let nav=sections.map(s=>`<button class="${page===s[0]?'active':''}" onclick="go('${s[0]}')">${s[1]} &nbsp; ${s[2]}</button>`).join('');$('nav').innerHTML=nav;$('tabbar').innerHTML=[...sections.slice(0,4),['more','☰','More']].map(s=>`<button class="${page===s[0]||s[0]==='more'&&['social','travel','ai'].includes(page)?'active':''}" onclick="${s[0]==='more'?'toggleMore()':`go('${s[0]}')`}">${s[1]}<span>${s[2]}</span></button>`).join('');$('moremenu').classList.add('hidden');$('content').innerHTML=({home,planner,work,social,health,travel,ai})[page]()}page=sections.some(s=>s[0]===location.hash.slice(1))?location.hash.slice(1):'home';window.addEventListener('hashchange',()=>{page=sections.some(s=>s[0]===location.hash.slice(1))?location.hash.slice(1):'home';render()});render();
</script></body></html>
